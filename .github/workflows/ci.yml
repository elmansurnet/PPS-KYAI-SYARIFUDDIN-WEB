name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, fileinfo, bcmath, pdo_sqlite, sqlite3, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Salin .env (tes memakai SQLite di memori, lihat phpunit.xml)
        run: cp .env.example .env

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          # filament:upgrade (post-autoload-dump) memakai cache; hindari butuh database saat install.
          CACHE_STORE: array

      - run: php artisan key:generate

      # PublicLayoutTest membaca manifest Vite, jadi build harus ada sebelum tes.
      - name: Build aset
        run: npm ci && npm run build

      - name: Tes
        run: composer test

      - name: Audit keamanan
        run: composer security
